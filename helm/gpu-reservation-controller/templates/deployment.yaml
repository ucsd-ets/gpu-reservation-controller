apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpu-reservation-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-reservation-controller.labels" . | nindent 4 }}
spec:
  # The controller holds in-memory queue state; running more than one replica
  # would result in duplicate toleration patches.  Always keep this at 1.
  replicas: 1
  # Recreate, not the RollingUpdate default: with replicas: 1 the default
  # surge starts the new pod and waits for it to become Ready *before*
  # terminating the old one, so every upgrade would transiently run the two
  # controllers the comment above forbids.  The controller also guards itself
  # at runtime with a coordination Lease (SINGLETON_LEASE_ENABLED).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gpu-reservation-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gpu-reservation-controller.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "gpu-reservation-controller.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.httpPort }}
              protocol: TCP
          env:
            # --- Required ---
            - name: RESERVATION_API_URL
              value: {{ required "reservationApiUrl is required" .Values.reservationApiUrl | quote }}
            - name: RESERVATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKeySecret.name | quote }}
                  key: {{ .Values.apiKeySecret.key | quote }}

            # --- Optional tuning ---
            - name: RESERVATION_FETCH_INTERVAL
              value: {{ .Values.config.reservationFetchInterval | quote }}
            - name: QUEUE_PROCESSOR_INTERVAL
              value: {{ .Values.config.queueProcessorInterval | quote }}
            - name: RESERVATION_LOOKAHEAD_DAYS
              value: {{ .Values.config.reservationLookaheadDays | quote }}
            - name: HTTP_PORT
              value: {{ .Values.config.httpPort | quote }}
            - name: ONDEMAND_LEASE_ENABLED
              value: {{ .Values.config.ondemandLeaseEnabled | quote }}
            - name: ONDEMAND_HORIZON_MINUTES
              value: {{ .Values.config.ondemandHorizonMinutes | quote }}
            - name: ONDEMAND_LEASE_BUFFER_MINUTES
              value: {{ .Values.config.ondemandLeaseBufferMinutes | quote }}
            - name: ONDEMAND_DELEGATE_ADMISSION
              value: {{ .Values.config.ondemandDelegateAdmission | quote }}
            - name: BEST_EFFORT_ENABLED
              value: {{ .Values.config.bestEffortEnabled | quote }}
            - name: NOSHOW_TIMEOUT_MINUTES
              value: {{ .Values.config.noshowTimeoutMinutes | quote }}
            - name: NOSHOW_GRACE_MINUTES
              value: {{ .Values.config.noshowGraceMinutes | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: LIBRARY_LOG_LEVEL
              value: {{ .Values.config.libraryLogLevel | quote }}
            {{- if .Values.config.podSchedulingGateName }}
            - name: POD_SCHEDULING_GATE_NAME
              value: {{ .Values.config.podSchedulingGateName | quote }}
            {{- end }}
            {{- if .Values.config.requiredGroupLabel }}
            - name: REQUIRED_GROUP_LABEL
              value: {{ .Values.config.requiredGroupLabel | quote }}
            {{- end }}
            - name: DEFAULT_MINIMUM_RUNTIME_SECONDS
              value: {{ .Values.config.defaultMinimumRuntimeSeconds | quote }}
            {{- if .Values.config.defaultUsageGroup }}
            - name: DEFAULT_USAGE_GROUP
              value: {{ .Values.config.defaultUsageGroup | quote }}
            {{- end }}
            - name: PREEMPTION_LEAD_MINUTES
              value: {{ .Values.config.preemptionLeadMinutes | quote }}
            - name: PREEMPTION_CHECK_INTERVAL
              value: {{ .Values.config.preemptionCheckInterval | quote }}
            - name: CAPACITY_CHECK_INTERVAL
              value: {{ .Values.config.capacityCheckInterval | quote }}
            - name: POD_ADOPTION_ENABLED
              value: {{ .Values.config.podAdoptionEnabled | quote }}
            - name: ONDEMAND_MERGE_ENABLED
              value: {{ .Values.config.ondemandMergeEnabled | quote }}
            - name: ONDEMAND_DENIAL_EVENT_ENABLED
              value: {{ .Values.config.ondemandDenialEventEnabled | quote }}
            - name: ONDEMAND_DENIAL_EVENT_REPEAT_MINUTES
              value: {{ .Values.config.ondemandDenialEventRepeatMinutes | quote }}
            - name: TERMINATION_WARNING_ENABLED
              value: {{ .Values.config.terminationWarningEnabled | quote }}
            - name: TERMINATION_WARNING_LEAD_MINUTES
              value: {{ .Values.config.terminationWarningLeadMinutes | quote }}
            - name: PREEMPTION_DELEGATE_SELECTION
              value: {{ .Values.config.preemptionDelegateSelection | quote }}
            - name: HEADROOM_TARGET_PERCENT
              value: {{ .Values.config.headroomTargetPercent | quote }}
            - name: HEADROOM_NOTICE_MINUTES
              value: {{ .Values.config.headroomNoticeMinutes | quote }}
            - name: HEADROOM_CHECK_INTERVAL
              value: {{ .Values.config.headroomCheckInterval | quote }}
            - name: OVERSTAY_REPORT_ENABLED
              value: {{ .Values.config.overstayReportEnabled | quote }}
            - name: SINGLETON_LEASE_ENABLED
              value: {{ .Values.config.singletonLeaseEnabled | quote }}
            - name: K8S_TLS_STRICT_VERIFY
              value: {{ .Values.config.k8sTlsStrictVerify | quote }}

            # --- Downward API: identity for the singleton Lease ---
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.inboundApiTokenSecret.name }}
            # Enables the inbound reservation-push API (POST /api/reservations/push).
            # Omit the secret to leave the endpoint disabled (returns 503).
            - name: INBOUND_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.inboundApiTokenSecret.name | quote }}
                  key: {{ .Values.inboundApiTokenSecret.key | quote }}
            {{- end }}
            {{- if .Values.config.timezone }}
            - name: TZ
              value: {{ .Values.config.timezone | quote }}
            {{- end }}
            {{- if .Values.config.eventDisplayTimezone }}
            # Localises the human-readable Event/annotation prose only; log
            # fields and every galends/* timestamp annotation stay UTC.
            - name: EVENT_DISPLAY_TIMEZONE
              value: {{ .Values.config.eventDisplayTimezone | quote }}
            {{- end }}

            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
