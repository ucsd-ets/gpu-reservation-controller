apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpu-reservation-controller.fullname" . }}
  labels:
    {{- include "gpu-reservation-controller.labels" . | nindent 4 }}
rules:
  # The controller lists and watches pods across all namespaces to detect
  # reservation candidates, patches pods to apply tolerations and record
  # runtime-guarantee annotations, and deletes pods when a reservation is
  # cancelled or when capacity must be recovered from an overstaying pod.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  # emit_runtime_guaranteed_event, emit_preempted_event, and
  # emit_reservation_cancelled_event create Normal events on admitted pods.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  # snapshot_node_gpu_capacity sums allocatable nvidia.com/gpu (or each class's
  # own unit) per gpu-class-reservation taint value to compute physical
  # capacity for preemption planning.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # acquire_singleton_lease / renew_singleton_lease hold a coordination Lease
  # so a second controller instance refuses to run (duplicate-instance guard,
  # not leader election).  Without this rule the controller logs a warning and
  # runs unguarded — it does not fail to start.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
