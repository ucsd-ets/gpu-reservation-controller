# Default values for gpu-reservation-controller.
#
# Note: replica count is intentionally not configurable — the controller holds
# in-memory queue state, so the Deployment hardcodes replicas: 1.

image:
  # -- Container image repository. Must be registry-qualified: an unqualified
  # name resolves to docker.io/library/<name>, which is not where this image
  # lives. `.github/workflows/docker.yml` pushes to
  # ghcr.io/<github-owner>/<repo-name>; override this in a fork.
  repository: ghcr.io/agt/gpu-reservation-controller
  # -- Image tag. `latest` is published by the workflow on the default branch.
  # Prefer pinning an immutable tag or a digest in production, and set
  # pullPolicy: IfNotPresent alongside it.
  tag: "latest"
  # -- Always, because the default tag above is a floating one: with
  # IfNotPresent a node that already has a `latest` layer never re-pulls, so
  # `helm upgrade` produces no pod-spec diff and rolls nothing. Switch to
  # IfNotPresent when you pin an immutable tag.
  pullPolicy: Always

# -- Image pull secrets for private registries. GHCR packages are private by
# default, so an unmodified `ghcr.io/...` reference needs one of these until the
# package is made public.
imagePullSecrets: []
# - name: ghcr-pull-secret

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Required application configuration
# ---------------------------------------------------------------------------

# Base URL of the reservation management API (required).
# Example: https://gpures.example.edu
reservationApiUrl: ""

# Reference to a pre-existing Secret containing the API service key.
# The Secret must exist in the release namespace before deploying this chart.
# The key value is injected as the RESERVATION_API_KEY environment variable.
apiKeySecret:
  name: gpu-reservation-api-key
  key: api-key

# Reference to a pre-existing Secret holding the bearer token for the inbound
# reservation-push API (POST /api/reservations/push). Leave `name` empty to keep
# the endpoint disabled (it returns 503 until INBOUND_API_TOKEN is set). When
# set, the Secret must exist in the release namespace before deploying; the value
# is injected as the INBOUND_API_TOKEN environment variable.
inboundApiTokenSecret:
  name: ""
  key: token

# ---------------------------------------------------------------------------
# Optional tuning — defaults mirror application defaults
# ---------------------------------------------------------------------------

config:
  # Seconds between reservation refresh cycles.
  reservationFetchInterval: 300

  # Seconds between queue-processor ticks (the whole work-queue loop: pod LIST,
  # JIT lease retries, no-show cancels, overstay adoption).
  queueProcessorInterval: 300

  # Calendar days ahead to fetch reservations.
  reservationLookaheadDays: 7

  # Bind port for the whole HTTP listener (GET /health liveness plus the inbound
  # push and preemption-risk forecast APIs).
  httpPort: 8000

  # Enable the JIT on-demand lease path: request a real on-demand reservation for
  # a pending pod with no open reservation window (set to false to disable).
  ondemandLeaseEnabled: true

  # Reserved-match horizon (minutes) for the JIT trigger: a pod is queued for
  # its own reservation when one opens now or within this many minutes and has
  # budget; otherwise, if the pod is JIT-eligible, the controller requests an
  # on-demand lease instead of waiting.
  ondemandHorizonMinutes: 30

  # Minutes added to a pod's galends/minimum-runtime-seconds annotation when
  # sizing the duration of a requested JIT lease.
  ondemandLeaseBufferMinutes: 10

  # Delegate on-demand admission selection to the app for LAS prioritization:
  # the controller offers the batch of eligible pending pods to
  # POST /api/reservations/ondemand-admission and admits only the subset the app
  # grants. The app endpoint is shipped, but its selection is grant-all today,
  # so turning this on changes no behaviour until the app carries real admission
  # policy; false (or any app-call failure) grants every eligible candidate
  # (greedy per-pod).
  ondemandDelegateAdmission: false

  # Honour a pod's galends/runtime-guarantee: "none" annotation by admitting it
  # under a zero-length, zero-SU kind="best_effort" reservation instead of a
  # guaranteed lease: no runtime guarantee, no Service Units, and preemptible
  # from the first second (sacrificed ahead of leases and bookings when capacity
  # is reclaimed). Requires a reservation app serving the best-effort create
  # shape -- against one that does not, every such pod backs off on a
  # non-retryable 4xx. false ignores the annotation entirely.
  bestEffortEnabled: false

  # Minutes after a reservation window opens before the holder is declared a
  # no-show and the controller durably cancels it app-side, freeing the
  # window for re-booking.
  noshowTimeoutMinutes: 15

  # Grace period (minutes) after controller startup before no-shows are
  # declared for windows already in progress.
  noshowGraceMinutes: 30

  # IANA timezone for log timestamps, and — unless eventDisplayTimezone
  # overrides it — for the human-readable text of the Kubernetes Events the
  # controller writes on pods.  Reservation window arithmetic is UTC-based and
  # does not depend on either.
  # Leave empty to use the container's system default (UTC).
  # Example: America/Los_Angeles
  timezone: ""

  # IANA timezone for the human-readable Event messages and the
  # galends/termination-warning-message annotation only — set this to localise
  # what users read via `kubectl describe pod` while leaving the logs (and
  # everything a machine parses) on UTC.
  # Leave empty to follow `timezone` above.
  # Example: America/Los_Angeles
  eventDisplayTimezone: ""

  # Log level: DEBUG, INFO, WARNING, ERROR
  logLevel: "INFO"

  # Log level for the HTTP and Kubernetes client libraries (httpx, httpcore,
  # urllib3, kubernetes), whose verbose output is raw API request/response
  # traces.  Can only make them quieter than logLevel, never louder — to see
  # the raw traces, set both to DEBUG.
  libraryLogLevel: "WARNING"

  # Name of the SchedulingGate to remove when admitting a pod.
  # Leave empty to disable scheduling gate management.
  podSchedulingGateName: ""

  # Optional pod label naming the usage group a pod belongs to (e.g.
  # "dsmlp/course").  When set, the controller additionally requires the pod's
  # value for this label to equal the reservation's group name before admitting
  # it, adopting it, or chain-extending its guarantee — an extra match axis
  # alongside gpu-class.  Leave empty to disable (no group constraint).
  requiredGroupLabel: ""

  # Minimum runtime (seconds) to assume for a pod carrying no usable
  # galends/minimum-runtime-seconds annotation, so it can still be JIT-eligible.
  # 0 disables the fallback: such a pod is left Pending, as before.
  defaultMinimumRuntimeSeconds: 0

  # Usage group to assume for a pod that names none.  With requiredGroupLabel
  # set this stands in for the missing *label* — the pod matches that group's
  # reservations exactly as if it carried it, and a JIT lease for the pod is
  # created under that group.  With requiredGroupLabel empty it stands in for a
  # missing galends/usage-group annotation (the JIT lease's group only).  Leave
  # empty to disable the fallback.
  defaultUsageGroup: ""

  # Minutes before an upcoming reservation slot boundary that the preemption
  # sweep's phase-A pass runs (proactively frees capacity from overstaying
  # pods so the incoming reservation has room when its window opens).
  preemptionLeadMinutes: 15

  # Seconds between preemption sweeps (checks whether any upcoming boundary
  # needs capacity freed, and whether any just-expired blocks need cleanup).
  preemptionCheckInterval: 60

  # Seconds between app-side vs physical GPU capacity audits (default hourly).
  # Each audit compares the reservation app's per-class total_gpus against the
  # GPUs physically present in the cluster, logs any difference as a WARNING,
  # and pauses new on-demand admissions for any class the app over-counts.
  capacityCheckInterval: 3600

  # Re-link an overstay pod (one running past its runtime guarantee) to a
  # reservation the same user has since booked, so it is no longer eligible
  # for preemption.  Set to false to disable.
  podAdoptionEnabled: true

  # Merge a JIT on-demand lease's pod into the user's matching booking the moment
  # that booking's window opens (re-link the pod, retire the lease penalty-exempt),
  # without waiting for the lease guarantee to lapse.  Set to false to disable
  # (the pod then converges lazily via adoption once past its lease guarantee).
  ondemandMergeEnabled: true

  # Mirror the reservation app's 409 denial reason for a JIT on-demand lease onto
  # the waiting pod as a Warning Kubernetes Event (reason=OnDemandLeaseDenied), so
  # the pod's owner can see why their job is still Pending without access to the
  # controller's logs.  Informational only — the controller retries either way.
  # Set to false to disable.
  ondemandDenialEventEnabled: true

  # How long an *unchanged* denial reason is suppressed before being restated on
  # the pod.  The lease retry cadence is 2-5 minutes, so without this a blocked
  # pod would collect a new Event every few minutes; the repeat still fires
  # because Events expire and a pod that is still stuck should still say so.  A
  # reason that *changes* is emitted immediately regardless.  0 = every denial.
  ondemandDenialEventRepeatMinutes: 30

  # Stamp pods at risk of demand-driven preemption with informational
  # galends/termination-warning-* annotations (projected termination time, risk
  # score, and a human-readable message) after each preemption sweep.  Purely
  # informational — nothing is enforced.  Set to false to disable.
  terminationWarningEnabled: true

  # How far ahead (minutes) the termination-warning look-ahead scans for at-risk
  # boundaries, decoupled from PREEMPTION_LEAD_MINUTES.  Larger than the kill lead
  # so a pod killed proactively at boundary − lead (a "phase-A" victim) is warned
  # before its boundary enters the kill window.  Larger = more advance notice but
  # more speculative warnings on future demand that may change.
  terminationWarningLeadMinutes: 30

  # Delegate preemption victim selection to the reservation app
  # (POST /api/reservations/preemption-victims) so prioritisation policy lives
  # there.  Set to false — or let any app-call failure occur — to fall back to
  # local uniform-random selection.
  preemptionDelegateSelection: true

  # Anticipatory headroom: percentage of each GPU class's physical capacity to
  # hold free for on-demand jobs that have not arrived yet, reclaimed from pods
  # running past their runtime guarantee.  Unlike boundary preemption this is a
  # standing goal, not a response to a booking.  0 disables it entirely (the
  # default); a pod inside its runtime guarantee is never a headroom victim.
  headroomTargetPercent: 0

  # Notice a headroom victim gets before it becomes killable.  A pod entering the
  # at-risk pool is first stamped with a galends/termination-warning-at deadline
  # and only becomes eligible once that deadline has elapsed, so a job can
  # checkpoint or re-book.  0 means no notice — kill on sight.  Requires
  # terminationWarningEnabled; with warnings off the gate is bypassed.
  headroomNoticeMinutes: 15

  # Seconds between headroom evaluations.  Headroom rides the preemption sweep
  # but is throttled to this much slower cadence, so an otherwise-idle cluster is
  # not LISTed on the sweep's own interval just to re-check headroom.  Note the
  # kill latency this implies: a warned pod dies between headroomNoticeMinutes
  # and headroomNoticeMinutes + this interval after being stamped.
  headroomCheckInterval: 600

  # Report each ended overstay's duration to the app for offline analysis
  # (POST /api/reservations/{id}/overstay).  Best-effort and analysis-only —
  # it records nothing that affects admission, capacity, or the reservation
  # pull.  Ships dark: leave false unless you want the reporting.
  overstayReportEnabled: false

  # Hold a coordination.k8s.io Lease so a second controller instance refuses to
  # run — two would issue duplicate toleration patches.  A duplicate-instance
  # guard, not leader election: there is no waiting to take over, and if the
  # coordination API is unreachable (e.g. an upgrade predating the leases RBAC
  # rule) the controller logs a warning and runs unguarded.  The holder
  # identity and namespace come from the downward API (POD_NAME /
  # POD_NAMESPACE), which the Deployment wires directly — they are plumbing,
  # not tunables, so they are deliberately not exposed here.
  singletonLeaseEnabled: true

  # OpenSSL strict X.509 verification on the connection to the Kubernetes API
  # server.  Python 3.13 turns these checks on by default, and they require an
  # Authority Key Identifier extension on the certificates the chain runs
  # through — which a cluster PKI generated by older tooling may not carry.  The
  # symptom is every API call failing with
  # "CERTIFICATE_VERIFY_FAILED ... Missing Authority Key Identifier" despite a
  # correctly mounted service-account ca.crt.  Regenerating the apiserver
  # certificate with an AKID is the real fix; set this to false as an escape
  # hatch until then.  It is NOT insecure-skip-tls-verify: the chain is still
  # verified against the mounted CA, validity dates still apply, and the
  # hostname is still matched.
  k8sTlsStrictVerify: true

# ---------------------------------------------------------------------------
# ServiceAccount and RBAC
# ---------------------------------------------------------------------------

serviceAccount:
  # Set to false to use an existing ServiceAccount specified by .name below.
  create: true
  # If empty and create=true, defaults to the fully-qualified release name.
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# Service (exposes the /health endpoint within the cluster)
# ---------------------------------------------------------------------------

service:
  type: ClusterIP
  port: 8000

# ---------------------------------------------------------------------------
# Deployment tuning
# ---------------------------------------------------------------------------

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Additional arbitrary environment variables injected into the container.
# Accepts the same structure as a Kubernetes EnvVar list entry, so both
# plain values and secretKeyRef/configMapKeyRef sources are supported.
# Example:
#   extraEnv:
#     - name: HTTP_PROXY
#       value: "http://proxy.example.com:3128"
extraEnv: []
